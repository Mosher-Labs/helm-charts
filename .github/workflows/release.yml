---
on:
  push:
    branches:
      - main

jobs:
  release:
    uses: "Mosher-Labs/.github/.github/workflows/release.yml@541b3d3c9182820bec7f027fb9c61a5c17974ed8" # v0.10.35
    permissions:
      contents: write
      issues: write
      pull-requests: write

  heimdallr:
    needs: release
    uses: "Mosher-Labs/.github/.github/workflows/heimdallr.yml@541b3d3c9182820bec7f027fb9c61a5c17974ed8" # v0.10.35
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      slack_message: "The project <https://github.com/${{ github.repository }}|${{ github.repository }}> just released version <https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.next_version }}|${{ needs.release.outputs.next_version }}>."
