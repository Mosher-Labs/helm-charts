---
replicaCount: 1
fullnameOverride: "hello-world"

image:
  repository: registry.k8s.io/echoserver
  tag: "1.10"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  nodePort: 30001
  targetPort: 8080

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/"
  hosts:
    - host: mosher-labs.local
      paths:
        - /hello-world
    - host: labs.benniemosher.dev
      paths:
        - /hello-world
  tls: []

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

# Requests are required for the HPA's targetCPUUtilizationPercentage to be
# computable - without a cpu request, the HPA can't calculate utilization
# and reports ScalingActive: False (FailedGetResourceMetric).
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Cloudflared tunnel configuration
# Set enabled: true when you have the cloudflared-credentials secret
# This is the DEFAULT - can be overridden in ArgoCD Application
cloudflared:
  enabled: false  # Safe default - won't fail if secret is missing
  image:
    repository: cloudflare/cloudflared
    tag: latest
  secretName: cloudflared-credentials
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: hello-world
        topologyKey: "kubernetes.io/hostname"
